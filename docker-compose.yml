name: mqtt-thing

services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORT}:1883"
    volumes:
      - ./infra/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npx node-pg-migrate up
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace @mqtt-thing/ingestion
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    volumes:
      - ./packages:/app/packages
      - ./services:/app/services
      - ./tools:/app/tools

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace @mqtt-thing/simulator
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      SIM_TENANT_ID: ${SIM_TENANT_ID}
      SIM_DEVICE_ID: ${SIM_DEVICE_ID}
      SIM_INTERVAL_MS: ${SIM_INTERVAL_MS}
      SIM_DUPLICATE_RATE: ${SIM_DUPLICATE_RATE}
      SIM_DROP_RATE: ${SIM_DROP_RATE}
      SIM_SKEW_MS: ${SIM_SKEW_MS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mosquitto:
        condition: service_started
    volumes:
      - ./packages:/app/packages
      - ./services:/app/services
      - ./tools:/app/tools

volumes:
  postgres-data:
  mosquitto-data:
